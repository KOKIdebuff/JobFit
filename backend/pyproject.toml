[project]
name = "hirelink-backend"
version = "0.1.0"
description = "HireLink P0 FastAPI modular monolith backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18,<1.19",
    "fastapi>=0.136,<0.137",
    "httpx>=0.28,<0.29",
    "pwdlib[argon2]>=0.3,<0.4",
    "pydantic>=2.13,<2.14",
    "pydantic-settings>=2.14,<2.15",
    "pyjwt>=2.13,<2.14",
    "pypdf>=6.13,<6.14",
    "python-docx>=1.2,<1.3",
    "python-multipart==0.0.32",
    "sqlalchemy>=2.0,<2.1",
    "structlog>=26.1,<26.2",
    "uvicorn[standard]>=0.49,<0.50",
]

[dependency-groups]
dev = [
    "mypy>=2.1,<2.2",
    "pytest>=9.0,<9.1",
    "ruff>=0.15,<0.16",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["structlog.*"]
ignore_missing_imports = true
